services:
  redis:
    image: redis:7-alpine
    container_name: data-analyzer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  api_service:
    build:
      context: .
      dockerfile: api_service/Dockerfile
    image: itzdineshyadav/data-analyzer:api
    container_name: data-analyzer-api
    restart: unless-stopped
    env_file:
      - ./shared/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      MONITORING_TRACES_DIR: /app/traces
      MONITORING_DB_PATH: /app/traces/traces.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./traces:/app/traces
      - ./shared:/app/shared
      - ./api_service:/app/api_service
      - ./monitoring:/app/monitoring
    depends_on:
      - redis

  worker_service:
    build:
      context: .
      dockerfile: worker_service/Dockerfile
    image: itzdineshyadav/data-analyzer:worker
    container_name: data-analyzer-worker
    restart: unless-stopped
    env_file:
      - ./shared/.env
      - ./analyzerEngine/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      MONITORING_TRACES_DIR: /app/traces
      MONITORING_DB_PATH: /app/traces/traces.db
      PARQUET_ROOT: /data/parquet
      SANDBOX_SOCKET_ROOT: /data/sandbox_sockets
      MEMORY_ROOT: /data/memory
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - parquet_data:/data/parquet
      - memory_data:/data/memory
      - sandbox_sockets:/data/sandbox_sockets
      - ./traces:/app/traces
      - ./shared:/app/shared
      - ./analyzerEngine:/app/analyzerEngine
      - ./worker_service:/app/worker_service
      - ./monitoring:/app/monitoring
    depends_on:
      - redis

volumes:
  redis_data:
    name: dataanalyzer_redis_data
  parquet_data:
    name: dataanalyzer_parquet_data
  memory_data:
    name: dataanalyzer_memory_data
  sandbox_sockets:
    name: dataanalyzer_sandbox_sockets