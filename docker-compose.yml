services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: data-analyzer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-stack-server --save 60 1 --loglevel warning

  api_service:
    build:
      context: .
      dockerfile: api_service/Dockerfile
    image: itzdineshyadav/data-analyzer:api
    container_name: data-analyzer-api
    env_file:
      - ./shared/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker_service:
    build:
      context: .
      dockerfile: worker_service/Dockerfile
    image: itzdineshyadav/data-analyzer:worker
    container_name: data-analyzer-worker
    env_file:
      - ./shared/.env
      - ./analyzerEngine/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      PARQUET_ROOT: /data/parquet
      SANDBOX_SOCKET_ROOT: /data/sandbox_sockets
      MEMORY_ROOT: /data/memory
      # No PARQUET_VOLUME_NAME/SANDBOX_SOCKET_VOLUME_NAME override here on purpose - leave
      # sandbox_manager.py's own defaults (dataanalyzer_parquet_data/dataanalyzer_sandbox_sockets)
      # in effect, which now match the pinned `name:` values below exactly. One source of truth
      # instead of two strings that have to be kept in sync by hand (see the volumes: block).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - parquet_data:/data/parquet
      - memory_data:/data/memory
      - sandbox_sockets:/data/sandbox_sockets
    depends_on:
      - redis
volumes:
  redis_data:
    name: dataanalyzer_redis_data
  parquet_data:
    name: dataanalyzer_parquet_data
  memory_data:
    name: dataanalyzer_memory_data
  sandbox_sockets:
    name: dataanalyzer_sandbox_sockets
