# Build api_service/worker_service images, push them to Docker Hub, then
# SSH into the EC2 box and bring the stack up from the pushed images (no
# building happens on EC2 - it only ever pulls + runs). This is the Server
# repo's own pipeline; the Client repo deploys independently and isn't
# touched here.
#
# --- One-time setup before this can run ---
#
# 1. Repo secrets (Settings -> Secrets and variables -> Actions):
#      DOCKERHUB_USERNAME   your Docker Hub username/org
#      DOCKERHUB_TOKEN      a Docker Hub access token (not your password -
#                            create one at hub.docker.com/settings/security)
#      EC2_HOST              the instance's public IP or DNS name
#      EC2_USER               ssh user, e.g. "ubuntu" (Ubuntu AMI) or "ec2-user" (AL2)
#      EC2_SSH_KEY            the PRIVATE key (full .pem contents) matching a
#                              public key already in the instance's
#                              ~/.ssh/authorized_keys
#      EC2_SSH_PORT (optional) defaults to 22 if not set
#
# 2. On the EC2 instance itself (once, manually over SSH):
#      - Install Docker + the Compose plugin, and add EC2_USER to the
#        `docker` group (`sudo usermod -aG docker $USER`, then re-login) so
#        these deploy steps don't need sudo.
#      - mkdir -p ~/data-analyzer
#      - Create ~/data-analyzer/shared/.env and
#        ~/data-analyzer/analyzerEngine/.env with real app secrets (Mongo,
#        JWT, OAuth, LLM provider keys, ...) - copy from
#        shared/.env.example / analyzerEngine/.env.example and fill in.
#        These are real secrets, never committed, and this workflow never
#        touches them - it only ever copies docker-compose*.yml +
#        observability/ up.
#      - Optional: copy .env.example -> .env in ~/data-analyzer and fill in
#        DOCKERHUB_USERNAME (+ Langfuse/Grafana secrets if you're also
#        running the observability overlay) so a plain `docker compose up`
#        run by hand on the box still works without extra flags.
#
# Once both are done, every push to main builds, pushes, and redeploys
# automatically. Trigger a redeploy without a new commit via the "Run
# workflow" button (workflow_dispatch below).

name: Build, push, and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build context is the repo root (`.`) - both Dockerfiles need shared/
      # as a sibling, see the comment at the top of each Dockerfile.
      - name: Build and push api_service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/data-analyzer-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/data-analyzer-api:${{ github.sha }}
          cache-from: type=gha,scope=api_service
          cache-to: type=gha,mode=max,scope=api_service

      - name: Build and push worker_service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/data-analyzer-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/data-analyzer-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker_service
          cache-to: type=gha,mode=max,scope=worker_service

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only the compose files + observability config get copied up - never
      # the app source, and never shared/.env or analyzerEngine/.env (those
      # aren't in the repo at all; see the one-time EC2 setup note above).
      # EC2 only needs enough to run `docker compose pull && up -d`.
      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "docker-compose.yml,docker-compose.observability.yml,observability"
          target: "~/data-analyzer"
          strip_components: 0

      - name: Pull images and restart the stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            cd ~/data-analyzer
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            # Pin this deploy to the exact commit that was just built, not
            # whatever "latest" happens to mean by the time this runs -
            # overrides any IMAGE_TAG sitting in a local .env on the box.
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
