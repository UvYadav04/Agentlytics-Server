name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login \
            --username "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build WORKER
        run: |
          docker build \
            -t itzidineshyadav/data-analyzer:worker \
            -f worker_service/Dockerfile \
            .

      - name: Build API
        run: |
          docker build \
            -t itzidineshyadav/data-analyzer:api \
            -f api_service/Dockerfile \
            .



      - name: Push API
        run: docker push itzidineshyadav/data-analyzer:api

      - name: Push Worker
        run: docker push itzidineshyadav/data-analyzer:worker

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/data-analyzer/scripts
            ./deploy-server.sh
