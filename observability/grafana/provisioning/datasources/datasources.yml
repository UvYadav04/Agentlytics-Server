# Auto-provisions both datasources on Grafana boot - no manual "Add
# datasource" click-through needed. Grafana admin login is
# GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD from the .env file next to
# docker-compose.yml.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
