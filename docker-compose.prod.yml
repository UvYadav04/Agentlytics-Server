services:
  redis:
    image: redis:7-alpine
    container_name: data-analyzer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  api_service:
    image: itzdineshyadav/data-analyzer:api
    container_name: data-analyzer-api
    env_file:
      - ./shared/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      OTEL_SERVICE_NAME: api_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker_service:
    image: itzdineshyadav/data-analyzer:worker
    container_name: data-analyzer-worker
    env_file:
      - ./shared/.env
      - ./analyzerEngine/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      OTEL_SERVICE_NAME: worker_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
      PARQUET_ROOT: /data/parquet
      SANDBOX_SOCKET_ROOT: /data/sandbox_sockets
      MEMORY_ROOT: /data/memory
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - parquet_data:/data/parquet
      - memory_data:/data/memory
      - sandbox_sockets:/data/sandbox_sockets
    depends_on:
      - redis

volumes:
  redis_data:
    name: dataanalyzer_redis_data
  parquet_data:
    name: dataanalyzer_parquet_data
  memory_data:
    name: dataanalyzer_memory_data
  sandbox_sockets:
    name: dataanalyzer_sandbox_sockets
